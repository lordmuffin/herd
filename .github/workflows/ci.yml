name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        # column is in bsdextrautils on Debian/Ubuntu; slim runner images (Forgejo) lack it.
        run: sudo apt-get update && sudo apt-get install -y shellcheck jq bsdextrautils
      - name: make test
        run: make test

  # Forgejo is canonical, so it cuts the release: after the tests pass on a push to main, if
  # there is no v<VERSION> release yet, it creates one (which also creates the tag) with the
  # tarball, SHA256SUMS, PKGBUILD and, if the runner has docker, the Arch package. The push
  # mirror then carries the tag to GitHub, where the github-release job below mirrors it.
  forgejo-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.server_url != 'https://github.com'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to release
        id: check
        env:
          # The automatic token; set a FORGEJO_RELEASE_TOKEN secret (write:repository) if it
          # lacks permission to create releases on your instance.
          TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(head -n1 VERSION)
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          { echo "VERSION=$version"; echo "TAG=v$version"; echo "API=$api"; } >>"$GITHUB_ENV"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: token $TOKEN" "$api/releases/tags/v$version")
          case $code in
            200) echo "release v$version already exists; bump VERSION to ship a new one"
                 echo "publish=false" >>"$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >>"$GITHUB_OUTPUT" ;;
            *)   echo "checking for release v$version failed: HTTP $code" >&2; exit 1 ;;
          esac

      - name: Build release assets
        if: steps.check.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y jq && packaging/release-assets.sh

      - name: Create Forgejo release
        if: steps.check.outputs.publish == 'true'
        env:
          TOKEN: ${{ secrets.FORGEJO_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          body=$(jq -n --arg t "$TAG" --arg sha "$GITHUB_SHA" --arg n "herd $VERSION" \
            '{tag_name: $t, target_commitish: $sha, name: $n, body: "", draft: false, prerelease: false}')
          id=$(curl -fsS -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
            -d "$body" "$API/releases" | jq -r .id)
          for f in dist/herd-"$VERSION".tar.gz dist/herd-*.pkg.tar.zst dist/SHA256SUMS dist/PKGBUILD; do
            [ -f "$f" ] || continue
            curl -fsS -X POST -H "Authorization: token $TOKEN" -F "attachment=@$f" \
              "$API/releases/$id/assets?name=$(basename "$f")" >/dev/null
            echo "uploaded $(basename "$f")"
          done
          echo "released $TAG: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"

  # GitHub mirrors the release when the tag arrives from Forgejo (or is pushed by hand). It
  # never creates tags itself: the push mirror would delete a GitHub-only tag again.
  github-release:
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match VERSION; skip if already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(head -n1 VERSION)
          echo "VERSION=$version" >>"$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION ($version)" >&2; exit 1
          fi
          draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft -q .isDraft 2>/dev/null || echo none)
          case $draft in
            false) echo "release $GITHUB_REF_NAME already published"; echo "publish=false" >>"$GITHUB_OUTPUT" ;;
            true)  # left over from a tag the mirror deleted; replace it
                   gh release delete "$GITHUB_REF_NAME" --yes; echo "publish=true" >>"$GITHUB_OUTPUT" ;;
            *)     echo "publish=true" >>"$GITHUB_OUTPUT" ;;
          esac

      - name: Build release assets
        if: steps.check.outputs.publish == 'true'
        run: packaging/release-assets.sh

      - name: Create GitHub Release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "herd $VERSION" --generate-notes \
            dist/herd-"$VERSION".tar.gz dist/herd-*.pkg.tar.zst dist/SHA256SUMS dist/PKGBUILD
